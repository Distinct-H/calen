<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1f2">
  <title>{% block title %}我们的日历{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-dvh bg-rose-50 text-slate-800 antialiased">

  <main class="mx-auto max-w-2xl px-4 pt-5 {% if user %}pb-28{% else %}pb-10{% endif %}">
    {% block content %}{% endblock %}
  </main>

  {% if user %}
  <!-- 手机优先：底部标签栏比顶部导航更好点 -->
  <nav class="fixed inset-x-0 bottom-0 border-t border-rose-100 bg-white/95 backdrop-blur
              pb-[env(safe-area-inset-bottom)]">
    <div class="mx-auto flex max-w-2xl">
      {% set tabs = [('/', '今日', '📝'), ('/settings', '设置', '⚙️')] %}
      {% for href, label, icon in tabs %}
      <a href="{{ href }}"
         class="flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs
                {% if request.url.path == href %}text-rose-600 font-semibold{% else %}text-slate-400{% endif %}">
        <span class="text-lg leading-none">{{ icon }}</span>
        {{ label }}
      </a>
      {% endfor %}
    </div>
  </nav>
  {% endif %}

</body>
</html>
