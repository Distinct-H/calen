{% extends "base.html" %}
{% block title %}今日 · 我们的日历{% endblock %}

{% block content %}
<header class="mb-5 flex items-end justify-between">
  <div>
    <p class="text-sm text-slate-400">{{ view.day | cn_date }}</p>
    <h1 class="text-xl font-semibold">你好，{{ user.display_name }}</h1>
  </div>
  <form method="post" action="/logout">
    <button class="text-xs text-slate-400 underline underline-offset-2">退出</button>
  </form>
</header>

{% if hints %}
<div class="mb-4 space-y-1.5">
  {% for hint in hints %}
  <p class="flex items-start gap-2 rounded-xl bg-amber-50 px-4 py-2.5 text-sm text-amber-800">
    <span class="shrink-0">🔔</span><span>{{ hint }}</span>
  </p>
  {% endfor %}
</div>
{% endif %}

{% include "partials/today_panel.html" %}
{% endblock %}
