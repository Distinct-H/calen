# 宿主机 Nginx 配置。放到 /etc/nginx/conf.d/couple-calendar.conf
#
# 备案前：server_name 保持 _ ，用 http://服务器IP 访问
# 备案后：把 server_name 改成域名，再跑 certbot 自动加 HTTPS 和跳转

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ⚠️ 必须显式放大：Nginx 默认只允许 1MB 请求体，而本应用单张图上限 10MB、
    # 一个事件可以一次传 9 张。不改这里上传大图会直接 413，而且报错很难定位。
    client_max_body_size 100M;

    # 大图上传慢，超时要跟着放宽
    client_body_timeout 300s;

    # 真实 IP 和协议传给应用，否则日志里全是 127.0.0.1，
    # 而且应用会以为自己跑在 http 上（影响 Cookie 的 Secure 判断）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 预留 WebSocket（当前没用到，以后加实时功能不用再改）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 图片接口要登录才能访问，所以不能让 Nginx 自己缓存。
    # 应用返回的是 private + immutable，这里只是显式确认一下不走共享缓存。
    location /images/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # 内部 cron 端点不该从公网访问——定时任务在服务器本机跑，走容器直连。
    # 真需要外部 cron 服务来打的话，把这段删掉。
    location /internal/ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/couple-access.log;
    error_log  /var/log/nginx/couple-error.log;
}
