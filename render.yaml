# Render 的蓝图配置（用 Railway 的话忽略这个文件）。
#
# 注意 Render 免费版的两个坑：
# 1. Web Service 闲置 15 分钟会休眠 → 必须靠外部 cron 唤醒并触发提醒
# 2. 免费 Postgres 有有效期，到期会被删除 → 务必配置定期导出备份
services:
  - type: web
    name: couple-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: couple-calendar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEFAULT_TIMEZONE
        value: Asia/Shanghai
      - key: PYTHON_VERSION
        value: "3.13"

databases:
  - name: couple-calendar-db
    plan: free
